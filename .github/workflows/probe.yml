name: PSX probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PSX with token
        run: |
          mkdir out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Mobile Safari/537.36"
          J=cookies.txt
          curl -sS -c $J -b $J -A "$UA" -D out/home_headers.txt -o home.html https://dps.psx.com.pk/company/LUCK
          K=$(grep -oE '"_k":"[^"]+"' home.html | cut -d'"' -f4)
          echo "token=$K" | tee out/index.txt
          for p in "/timeseries/eod/LUCK" "/timeseries/int/LUCK" "/timeseries/eod/KSE100" "/timeseries/int/KSE100" "/symbols" "/indices/KSE100" "/trading-board/REG/main"; do
            f=$(echo "$p" | tr '/' '_')
            code=$(curl -sS -b $J -c $J -A "$UA" -H "X-Req-Id: $K" -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://dps.psx.com.pk/company/LUCK" -H "Accept: application/json, text/javascript, */*; q=0.01" -o "out/$f" -w "%{http_code} %{content_type} %{size_download}" "https://dps.psx.com.pk$p")
            echo "$p (token+cookie) -> $code" | tee -a out/index.txt
          done
          code=$(curl -sS -A "$UA" -H "X-Req-Id: $K" -H "X-Requested-With: XMLHttpRequest" -o out/nocookie -w "%{http_code} %{size_download}" "https://dps.psx.com.pk/timeseries/eod/LUCK"); echo "eod token-only -> $code" | tee -a out/index.txt
          code=$(curl -sS -b $J -A "$UA" -H "X-Requested-With: XMLHttpRequest" -o out/notoken -w "%{http_code} %{size_download}" "https://dps.psx.com.pk/timeseries/eod/LUCK"); echo "eod cookie-only -> $code" | tee -a out/index.txt
          cp $J out/cookies.txt
          head -c 600 out/_timeseries_eod_LUCK; echo
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Commit samples
        if: ${{ !contains(github.event.head_commit.message, 'samples') }}
        run: |
          cd repo && mkdir -p samples && cp ../out/* samples/ 2>/dev/null; cp ../out/_home samples/_home 2>/dev/null || true
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add samples && git commit -m "samples" && git push
