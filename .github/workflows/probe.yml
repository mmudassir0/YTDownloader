name: PSX probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PSX pages
        run: |
          mkdir out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Mobile Safari/537.36"
          for p in "/static/script.js?v=1.76" "/historical" "/graphical-view" "/sector-summary"; do
            f=$(echo "$p" | tr '/' '_'); [ "$f" = "_" ] && f="_home"
            code=$(curl -sS -L -A "$UA" -o "out/$f" -w "%{http_code} %{content_type} %{size_download}" "https://dps.psx.com.pk$p" || echo fail)
            echo "$p -> $code" | tee -a out/index.txt
          done
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Commit samples
        if: ${{ !contains(github.event.head_commit.message, 'samples') }}
        run: |
          cd repo && mkdir -p samples && cp ../out/* samples/ 2>/dev/null; cp ../out/_home samples/_home 2>/dev/null || true
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add samples && git commit -m "samples" && git push
