name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk YTDownloader.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YTDownloader-apk
          path: YTDownloader.apk
      # Publishes the APK as a "latest" release so it can be downloaded directly on a phone
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YT Downloader build ${{ github.run_number }}
          make_latest: true
          files: YTDownloader.apk
